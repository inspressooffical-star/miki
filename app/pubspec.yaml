name: miki
description: "Oriental Fortune & Destiny Reader App - iOS & Android Compatible"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Networking
  dio: ^5.3.0
  retrofit: ^4.0.0

  # JSON Serialization
  json_annotation: ^4.8.0
  json_serializable: ^6.7.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # UI & Theme
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  get_it: ^7.5.0
  logger: ^2.0.0
  device_info_plus: ^10.0.0
  connectivity_plus: ^5.0.0

  # Date/Time
  table_calendar: ^3.0.0
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  retrofit_generator: ^7.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700