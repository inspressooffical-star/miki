version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: miki-db
    environment:
      POSTGRES_USER: miki_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: miki_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miki_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: miki-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://miki_user:password@postgres:5432/miki_db
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      ENVIRONMENT: development
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - miki-network

volumes:
  postgres_data:

networks:
  miki-network:
    driver: bridge
